{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1">Forgot username</h4>
        <p class="text-muted small mb-4">Enter the email address on your account and we'll email you your username.</p>
        <form method="post">
          {% csrf_token %}
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" name="email" class="form-control mb-3" required autofocus>
          <button type="submit" class="btn btn-primary w-100">Email my username</button>
        </form>
        <div class="text-center mt-3 small"><a href="{% url 'login' %}">Back to login</a></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
