{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1">Enter verification code</h4>
        <p class="text-muted small mb-4">We sent a 6-digit code for the account with mobile {{ masked_mobile }}. It expires in 5 minutes.</p>
        <form method="post">
          {% csrf_token %}
          <label for="otp" class="form-label">Code</label>
          <input type="text" id="otp" name="otp" class="form-control mb-3 text-center fs-4" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
          <button type="submit" class="btn btn-success w-100">Verify</button>
        </form>
        <div class="text-center mt-3 small">
          Didn't get it? <a href="{% url 'password_reset_mobile' %}">Request a new code</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
