{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card shadow-sm text-center">
      <div class="card-body p-4">
        <i class="bi bi-envelope-check fs-1 text-success"></i>
        <h4 class="mt-2">Check your email</h4>
        <p class="text-muted">If an account exists for that address, we've sent a password reset link. It also includes your username. Check your spam folder if it doesn't arrive in a few minutes.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
