# Local production-like stack.  Usage:  docker compose up --build
# Redis and Kafka will be added here in later phases.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartshop
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartshop-local-only}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # lets local tools (and `manage.py` outside Docker) reach the DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshop -d smartshop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: smartshop-web:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      DATABASE_URL: "postgres://smartshop:${POSTGRES_PASSWORD:-smartshop-local-only}@db:5432/smartshop"
      RUN_MIGRATIONS: "true"
      LOAD_CATALOG: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
