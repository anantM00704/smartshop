{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1">Reset password</h4>
        <p class="text-muted small mb-4">Enter the mobile number linked to your account. We'll send a 6-digit code to your registered email (and by SMS when enabled).</p>
        <form method="post">
          {% csrf_token %}
          <label for="mobile" class="form-label">Mobile number</label>
          <input type="tel" id="mobile" name="mobile" class="form-control mb-3" value="{{ mobile|default:'' }}" inputmode="numeric" maxlength="15" required autofocus>
          <button type="submit" class="btn btn-primary w-100">Send code</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
