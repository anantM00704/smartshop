{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1">Reset password via email</h4>
        <p class="text-muted small mb-4">Enter your account's email address. We'll send a link to set a new password, along with your username.</p>
        <form method="post">
          {% csrf_token %}
          <label for="id_email" class="form-label">Email address</label>
          <input type="email" id="id_email" name="email" class="form-control mb-3{% if form.email.errors %} is-invalid{% endif %}" required autofocus>
          {% for error in form.email.errors %}<div class="invalid-feedback d-block mb-2">{{ error }}</div>{% endfor %}
          <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </form>
        <div class="text-center mt-3 small"><a href="{% url 'password_reset_options' %}">Other options</a></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
